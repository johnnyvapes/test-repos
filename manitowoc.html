<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Johnny Vapes — Manitowoc, Wisconsin Traffic</title><style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#111;font-family:Arial,Helvetica,sans-serif}#app{width:100vw;height:100vh;background:#111}#header{height:11vh;min-height:72px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;border-bottom:3px solid #444;letter-spacing:1px;position:relative;z-index:5}#title{font-size:clamp(28px,3.1vw,54px);font-weight:800;line-height:1}#subtitle{margin-top:6px;font-size:clamp(15px,1.35vw,26px);font-weight:600;opacity:.9;letter-spacing:.5px}#content{position:relative;height:89vh;min-height:0}#mapWrap,#map{position:absolute;inset:0}
  /* Fixed incident panel: no scrollbar; JavaScript scales text to fit. */
  
  #incidents {

    font-size: calc(27px * var(--incident-scale));

  }
  #incidentStatus {
    font-size: calc(14px * var(--incident-scale));

  #incidentList { overflow: visible !important; }
  .incidentCard {
    border-top: 1px solid rgba(255,255,255,.18);
    padding: calc(6px * var(--incident-scale)) 0 calc(7px * var(--incident-scale));

  .incidentHead {
    display: flex;
    align-items: center;
    gap: calc(5px * var(--incident-scale));

  }
  .incidentRoad {
    margin-top: calc(2px * var(--incident-scale));

    font-weight: 800;
    line-height: 1.05;
  }
  .incidentDirection {
    margin-top: calc(2px * var(--incident-scale));

    opacity: .75;
    font-weight: 700;

  }
  .incidentDescription {
    margin-top: calc(3px * var(--incident-scale));
    font-size: calc(14px * var(--incident-scale));

    opacity: .92;
  }
  .incidentLanes {
    margin-top: calc(2px * var(--incident-scale));

  }
  .noIncidents, .feedError {
    padding-top: calc(7px * var(--incident-scale));

  /* Legend remains inside the top banner. */
  #footer {

  .legendItem { display:flex; align-items:center; gap:5px; }

</style></head><body><div id="app"><header id="header"><div id="title">CURRENT TRAFFIC CONDITIONS</div><div id="subtitle">Johnny Vapes — Manitowoc, Wisconsin</div>
  <footer id="footer"><div class="legendItem"><span class="dot normal"></span>Normal</div><div class="legendItem"><span class="dot moderate"></span>Moderate</div><div class="legendItem"><span class="dot heavy"></span>Heavy</div><div class="legendItem"><span class="dot severe"></span>Severe</div></footer>
</header><main id="content"><section id="mapWrap"><div id="map"></div></section><aside id="incidents">
      <div id="incidentTitle">CLOSURES &amp; INCIDENTS</div>
      <div id="incidentStatus">Loading live events…</div>
      <div id="incidentList"></div>
    </aside></main></div><script>const INCIDENT_REFRESH_MS = 10 * 60 * 1000;
function distanceMiles(lat1, lon1, lat2, lon2) {
  const R=3958.7613,p1=lat1*Math.PI/180,p2=lat2*Math.PI/180,dp=(lat2-lat1)*Math.PI/180,dl=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function formatFeedTime(value){const d=new Date(value);return Number.isNaN(d.getTime())?"recently":d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});}
function incidentIcon(type,fullClosure){if(fullClosure||type==="closures")return "⛔";if(type==="roadwork")return "🚧";return "🚨";}
function incidentLabel(type){if(type==="closures")return "CLOSURE";if(type==="roadwork")return "ROADWORK";return "INCIDENT";}
function cleanDescription(text){return text?String(text).replace(/\s+/g," ").trim():"";}
function escapeHtml(text){return cleanDescription(text).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));}
function renderIncidents(events,updatedAt){
  const box=document.getElementById("incidentList"),status=document.getElementById("incidentStatus");if(!box||!status)return;
  if(!events.length){status.textContent=updatedAt?`Updated ${formatFeedTime(updatedAt)}`:"Feed updated";box.innerHTML='<div class="noIncidents">✓ No active closures or incidents nearby.</div>';return;}
  status.textContent=`${events.length} active event${events.length===1?"":"s"} • Updated ${updatedAt?formatFeedTime(updatedAt):"recently"}`;
  box.innerHTML=events.map(e=>{
    const type=e.EventType||"accidentsAndIncidents",desc=escapeHtml(e.Description||e.Comment||"No description available."),road=escapeHtml(e.RoadwayName||""),direction=escapeHtml(e.DirectionOfTravel||""),lanes=escapeHtml(e.LanesAffected||""),closure=e.IsFullClosure?" • ALL LANES CLOSED":"";
    return `<div class="incidentCard"><div class="incidentHead"><span class="incidentIcon">${incidentIcon(type,e.IsFullClosure)}</span><span class="incidentType">${incidentLabel(type)}</span></div><div class="incidentRoad">${road||"Roadway not specified"}</div>${direction?`<div class="incidentDirection">${direction}${closure}</div>`:(closure?`<div class="incidentDirection">ALL LANES CLOSED</div>`:"")}<div class="incidentDescription">${desc}</div>${lanes&&!/no data/i.test(lanes)?`<div class="incidentLanes">${lanes}</div>`:""}</div>`;
  }).join("");
}
async function get511Events(){
  const response=await fetch(`events.json?ts=${Date.now()}`,{cache:"no-store"});
  if(!response.ok) throw new Error(`Incident feed HTTP ${response.status}`);
  const payload=await response.json();
  if(!payload || !Array.isArray(payload.events)) throw new Error("Invalid incident feed format");
  return {events:payload.events,updatedAt:payload.updatedAt||null};
}



function fitIncidentPanel() {
  const panel = document.getElementById("incidents");
  const list = document.getElementById("incidentList");
  if (!panel || !list) return;

  // Start at the normal readable size and let short feeds use only the
  // space they actually need.
  let scale = 1.0;
  const minScale = 0.48;
  panel.style.setProperty("--incident-scale", "1");

  // The panel is height:auto. If the feed is taller than the available
  // screen area, progressively reduce all incident typography/padding
  // until the complete feed fits without a scrollbar.
  const fit = () => {
    while (scale > minScale && panel.scrollHeight > panel.clientHeight + 1) {
      scale = Math.max(minScale, scale - 0.025);
      panel.style.setProperty("--incident-scale", scale.toFixed(3));
    }
  };

  requestAnimationFrame(() => {
    fit();
    requestAnimationFrame(fit);
  });
}

async function refreshIncidents(stores,radiusMiles){
  const status=document.getElementById("incidentStatus"),box=document.getElementById("incidentList");if(!status||!box)return;
  status.textContent="Updating…";
  try{
    const feed=await get511Events();
    const all=feed.events;
    const nearby=all.filter(e=>{const lat=Number(e.Latitude),lng=Number(e.Longitude);return Number.isFinite(lat)&&Number.isFinite(lng)&&stores.some(s=>distanceMiles(s.lat,s.lng,lat,lng)<=radiusMiles);});
    nearby.sort((a,b)=>{const rank=e=>e.EventType==="closures"?0:(e.EventType==="accidentsAndIncidents"?1:2),ra=rank(a),rb=rank(b);if(ra!==rb)return ra-rb;const da=Math.min(...stores.map(s=>distanceMiles(s.lat,s.lng,Number(a.Latitude),Number(a.Longitude)))),db=Math.min(...stores.map(s=>distanceMiles(s.lat,s.lng,Number(b.Latitude),Number(b.Longitude))));return da-db;});
    renderIncidents(nearby.slice(0,8),feed.updatedAt);
  }catch(err){
    console.error("Incident feed error:",err);status.textContent="Unable to update";
    const detail=err&&err.message?err.message:"Feed unavailable.";
    box.innerHTML=`<div class="feedError">Incident feed unavailable right now.<br><small>${escapeHtml(detail)}<br>Google live traffic remains active.</small></div>`;
  }
}
const incidentStores = [{lat:44.0764905,lng:-87.7022507}];
document.addEventListener("DOMContentLoaded",()=>{refreshIncidents(incidentStores,18);setInterval(()=>refreshIncidents(incidentStores,18),INCIDENT_REFRESH_MS);});

function initMap(){const store={lat:44.0764905,lng:-87.7022507};const map=new google.maps.Map(document.getElementById("map"),{center:store,zoom:14,mapTypeId:"roadmap",disableDefaultUI:true,clickableIcons:false,keyboardShortcuts:false,gestureHandling:"none",streetViewControl:false,fullscreenControl:false,mapTypeControl:false,zoomControl:false,scaleControl:false,rotateControl:false,cameraControl:false});const trafficLayer=new google.maps.TrafficLayer({autoRefresh:true});trafficLayer.setMap(map);new google.maps.Marker({position:store,map:map,title:"Johnny Vapes",icon:{url:"johnny-logo.png",scaledSize:new google.maps.Size(42,42),anchor:new google.maps.Point(21,21)},zIndex:1000});window.addEventListener("resize",()=>{google.maps.event.trigger(map,"resize");map.setCenter(store)})}window.gm_authFailure=function(){document.body.innerHTML='<div style="font-family:Arial;color:#fff;background:#111;height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px"><div><h1>Google Maps authentication failed</h1><p>Check the test API key and Maps JavaScript API configuration.</p></div></div>'};</script><script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCpWlFxjK5N5_tfbyYZ6rLeohDxKRHvznw&loading=async&callback=initMap&v=weekly"></script></body></html>
