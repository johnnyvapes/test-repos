<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV Bro / Chrome Viewport Diagnostic</title>
<style>
  :root { color-scheme: only light; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; font-family:Arial,Helvetica,sans-serif; background:#111; color:#fff; }
  body { padding:24px; }
  h1 { margin:0 0 18px; font-size:34px; }
  .note { margin:0 0 18px; font-size:18px; line-height:1.4; opacity:.9; }
  pre {
    white-space:pre-wrap;
    word-break:break-word;
    background:#1c1c1c;
    border:2px solid #555;
    border-radius:10px;
    padding:18px;
    font-size:20px;
    line-height:1.35;
  }
  #ruler {
    position:fixed;
    left:0; top:0;
    width:100vw; height:100vh;
    border:4px solid #ff3b30;
    pointer-events:none;
    z-index:9999;
  }
</style>
</head>
<body>
<div id="ruler"></div>
<h1>TV Bro / Chrome Viewport Diagnostic</h1>
<p class="note">No Google Maps API is loaded on this page. Reloading it does not consume a Maps request.</p>
<pre id="out">Collecting…</pre>
<script>
function getWebGL(){
  try{
    const c=document.createElement("canvas");
    const gl=c.getContext("webgl2")||c.getContext("webgl");
    if(!gl) return {available:false};
    const dbg=gl.getExtension("WEBGL_debug_renderer_info");
    return {
      available:true,
      version:gl.getParameter(gl.VERSION),
      vendor:dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR),
      renderer:dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)
    };
  }catch(e){ return {available:false,error:String(e)}; }
}
function collect(){
  const vv=window.visualViewport;
  const data={
    timestamp:new Date().toISOString(),
    userAgent:navigator.userAgent,
    platform:navigator.platform,
    innerWidth:window.innerWidth,
    innerHeight:window.innerHeight,
    outerWidth:window.outerWidth,
    outerHeight:window.outerHeight,
    documentClientWidth:document.documentElement.clientWidth,
    documentClientHeight:document.documentElement.clientHeight,
    screenWidth:screen.width,
    screenHeight:screen.height,
    screenAvailWidth:screen.availWidth,
    screenAvailHeight:screen.availHeight,
    devicePixelRatio:window.devicePixelRatio,
    visualViewport: vv ? {
      width:vv.width,
      height:vv.height,
      scale:vv.scale,
      offsetLeft:vv.offsetLeft,
      offsetTop:vv.offsetTop
    } : null,
    prefersDark:matchMedia("(prefers-color-scheme: dark)").matches,
    pointerCoarse:matchMedia("(pointer: coarse)").matches,
    hoverNone:matchMedia("(hover: none)").matches,
    orientation:screen.orientation ? {
      type:screen.orientation.type,
      angle:screen.orientation.angle
    } : null,
    webgl:getWebGL()
  };
  document.getElementById("out").textContent=JSON.stringify(data,null,2);
}
collect();
addEventListener("resize",collect);
if(window.visualViewport) visualViewport.addEventListener("resize",collect);
</script>
</body>
</html>
