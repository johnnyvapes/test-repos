<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Johnny Vapes — Weston, Wisconsin Traffic</title><style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#111;font-family:Arial,Helvetica,sans-serif}#app{width:100vw;height:100vh;background:#111}#header{height:11vh;min-height:72px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;border-bottom:3px solid #444;letter-spacing:1px;position:relative;z-index:5}#title{font-size:clamp(28px,3.1vw,54px);font-weight:800;line-height:1}#subtitle{margin-top:6px;font-size:clamp(15px,1.35vw,26px);font-weight:600;opacity:.9;letter-spacing:.5px}#content{position:relative;height:89vh;min-height:0}#mapWrap,#map{position:absolute;inset:0}#incidents{position:absolute;z-index:4;right:1.2vw;top:1.8vh;width:min(18vw,330px);max-height:34vh;overflow:hidden;background:rgba(17,17,17,.90);color:#fff;border:2px solid rgba(255,255,255,.30);border-radius:10px;padding:14px 16px;box-shadow:0 3px 14px rgba(0,0,0,.45)}#incidentTitle{font-size:clamp(18px,1.45vw,27px);font-weight:800;line-height:1.05;margin-bottom:10px}#incidentLive{font-size:clamp(12px,.92vw,17px);line-height:1.35;font-weight:700}.liveDot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#34a853;margin-right:7px}#incidentText{margin-top:8px;font-size:clamp(12px,.9vw,16px);line-height:1.35;opacity:.9}#incidentNote{margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.18);font-size:clamp(10px,.72vw,14px);opacity:.55}#footer{position:absolute;z-index:4;left:1.2vw; bottom:12px; transform:none;background:rgba(17,17,17,.88);color:#fff;display:flex;align-items:center;justify-content:center;gap:clamp(14px,2.2vw,38px);border:2px solid rgba(255,255,255,.25);border-radius:9px;padding:8px 18px;font-size:clamp(13px,1.05vw,20px);font-weight:700;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.4)}.legendItem{display:flex;align-items:center;gap:7px}.dot{width:clamp(11px,.9vw,17px);height:clamp(11px,.9vw,17px);border-radius:50%;display:inline-block}.normal{background:#34a853}.moderate{background:#fbbc04}.heavy{background:#f4511e}.severe{background:#d93025}@media(max-width:900px){#incidents{width:250px;max-height:31vh}#footer{gap:10px;padding:7px 12px}}
/* Readable live incident list */

</style></head><body><div id="app"><header id="header"><div id="title">CURRENT TRAFFIC CONDITIONS</div><div id="subtitle">Johnny Vapes — Weston, Wisconsin</div></header><main id="content"><section id="mapWrap"><div id="map"></div></section><aside id="incidents">
      <div id="incidentTitle">CLOSURES &amp; INCIDENTS</div>
      <div id="incidentStatus">Loading live events…</div>
      <div id="incidentList"></div>
    </aside><footer id="footer"><div class="legendItem"><span class="dot normal"></span>Normal</div><div class="legendItem"><span class="dot moderate"></span>Moderate</div><div class="legendItem"><span class="dot heavy"></span>Heavy</div><div class="legendItem"><span class="dot severe"></span>Severe</div></footer></main></div><script>const INCIDENT_REFRESH_MS = 10 * 60 * 1000;
function distanceMiles(lat1, lon1, lat2, lon2) {
  const R=3958.7613,p1=lat1*Math.PI/180,p2=lat2*Math.PI/180,dp=(lat2-lat1)*Math.PI/180,dl=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function formatFeedTime(value){const d=new Date(value);return Number.isNaN(d.getTime())?"recently":d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});}
function incidentIcon(type,fullClosure){if(fullClosure||type==="closures")return "⛔";if(type==="roadwork")return "🚧";return "🚨";}
function incidentLabel(type){if(type==="closures")return "CLOSURE";if(type==="roadwork")return "ROADWORK";return "INCIDENT";}
function cleanDescription(text){return text?String(text).replace(/\s+/g," ").trim():"";}
function escapeHtml(text){return cleanDescription(text).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));}
function renderIncidents(events,updatedAt){
  const box=document.getElementById("incidentList"),status=document.getElementById("incidentStatus");if(!box||!status)return;
  if(!events.length){status.textContent=updatedAt?`Updated ${formatFeedTime(updatedAt)}`:"Feed updated";box.innerHTML='<div class="noIncidents">✓ No active closures or incidents nearby.</div>';return;}
  status.textContent=`${events.length} active event${events.length===1?"":"s"} • Updated ${updatedAt?formatFeedTime(updatedAt):"recently"}`;
  box.innerHTML=events.map(e=>{
    const type=e.EventType||"accidentsAndIncidents",desc=escapeHtml(e.Description||e.Comment||"No description available."),road=escapeHtml(e.RoadwayName||""),direction=escapeHtml(e.DirectionOfTravel||""),lanes=escapeHtml(e.LanesAffected||""),closure=e.IsFullClosure?" • ALL LANES CLOSED":"";
    return `<div class="incidentCard"><div class="incidentHead"><span class="incidentIcon">${incidentIcon(type,e.IsFullClosure)}</span><span class="incidentType">${incidentLabel(type)}</span></div><div class="incidentRoad">${road||"Roadway not specified"}</div>${direction?`<div class="incidentDirection">${direction}${closure}</div>`:(closure?`<div class="incidentDirection">ALL LANES CLOSED</div>`:"")}<div class="incidentDescription">${desc}</div>${lanes&&!/no data/i.test(lanes)?`<div class="incidentLanes">${lanes}</div>`:""}</div>`;
  }).join("");
}
async function get511Events(){
  const response=await fetch(`events.json?ts=${Date.now()}`,{cache:"no-store"});
  if(!response.ok) throw new Error(`Incident feed HTTP ${response.status}`);
  const payload=await response.json();
  if(!payload || !Array.isArray(payload.events)) throw new Error("Invalid incident feed format");
  return {events:payload.events,updatedAt:payload.updatedAt||null};
}
async function refreshIncidents(stores,radiusMiles){
  const status=document.getElementById("incidentStatus"),box=document.getElementById("incidentList");if(!status||!box)return;
  status.textContent="Updating…";
  try{
    const feed=await get511Events();
    const all=feed.events;
    const nearby=all.filter(e=>{const lat=Number(e.Latitude),lng=Number(e.Longitude);return Number.isFinite(lat)&&Number.isFinite(lng)&&stores.some(s=>distanceMiles(s.lat,s.lng,lat,lng)<=radiusMiles);});
    nearby.sort((a,b)=>{const rank=e=>e.EventType==="closures"?0:(e.EventType==="accidentsAndIncidents"?1:2),ra=rank(a),rb=rank(b);if(ra!==rb)return ra-rb;const da=Math.min(...stores.map(s=>distanceMiles(s.lat,s.lng,Number(a.Latitude),Number(a.Longitude)))),db=Math.min(...stores.map(s=>distanceMiles(s.lat,s.lng,Number(b.Latitude),Number(b.Longitude))));return da-db;});
    renderIncidents(nearby.slice(0,8),feed.updatedAt);
  }catch(err){
    console.error("Incident feed error:",err);status.textContent="Unable to update";
    const detail=err&&err.message?err.message:"Feed unavailable.";
    box.innerHTML=`<div class="feedError">Incident feed unavailable right now.<br><small>${escapeHtml(detail)}<br>Google live traffic remains active.</small></div>`;
  }
}
const incidentStores = [{lat:44.9068107,lng:-89.5895614}];
document.addEventListener("DOMContentLoaded",()=>{refreshIncidents(incidentStores,18);setInterval(()=>refreshIncidents(incidentStores,18),INCIDENT_REFRESH_MS);});

function initMap(){const store={lat:44.9068107,lng:-89.5895614};const map=new google.maps.Map(document.getElementById("map"),{center:store,zoom: 14,mapTypeId:"roadmap",disableDefaultUI:true,clickableIcons:false,keyboardShortcuts:false,gestureHandling:"none",streetViewControl:false,fullscreenControl:false,mapTypeControl:false,zoomControl:false,scaleControl:false,rotateControl:false,cameraControl:false});const trafficLayer=new google.maps.TrafficLayer({autoRefresh:true});trafficLayer.setMap(map);new google.maps.Marker({position:store,map:map,title:"Johnny Vapes",icon:{url:"johnny-logo.png",scaledSize:new google.maps.Size(42,42),anchor:new google.maps.Point(21,21)},zIndex:1000});window.addEventListener("resize",()=>{google.maps.event.trigger(map,"resize");map.setCenter(store)})}window.gm_authFailure=function(){document.body.innerHTML='<div style="font-family:Arial;color:#fff;background:#111;height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px"><div><h1>Google Maps authentication failed</h1><p>Check the test API key and Maps JavaScript API configuration.</p></div></div>'};</script><script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAdbPq5kk4D1xjx4Z4jgp6feB1I4kvOPCA&loading=async&callback=initMap&v=weekly"></script></body></html>
