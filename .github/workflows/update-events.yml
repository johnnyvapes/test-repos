name: Update 511WI incident feed

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Fetch 511WI events
        env:
          API_KEY: ${{ secrets.WI_511_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$API_KEY"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 \
            "https://511wi.gov/api/v2/get/event?key=${API_KEY}&format=json" \
            -o /tmp/events.json
          jq -e 'type == "array"' /tmp/events.json >/dev/null
          jq --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{updatedAt:$now,events:.}' /tmp/events.json > /tmp/events-feed.json

      - name: Update repository only when event data changed
        run: |
          set -euo pipefail
          if [ -f events.json ]; then
            jq -S '.events' events.json > /tmp/old-events.json
          else
            printf '[]\n' > /tmp/old-events.json
          fi
          jq -S '.events' /tmp/events-feed.json > /tmp/new-events.json

          if cmp -s /tmp/old-events.json /tmp/new-events.json; then
            echo "No 511WI event changes. Nothing to commit."
            exit 0
          fi

          cp /tmp/events-feed.json events.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          git commit -m "Update 511WI incident feed"
          git push
