<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Johnny Vapes — Manitowoc Traffic</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #111;
    font-family: Arial, Helvetica, sans-serif;
  }

  #app {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #111;
  }

  #header {
    height: 13vh;
    min-height: 80px;
    background: #111;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    border-bottom: 3px solid #444;
    letter-spacing: 1px;
  }

  #title {
    font-size: clamp(28px, 3.1vw, 54px);
    font-weight: 800;
    line-height: 1;
  }

  #subtitle {
    margin-top: 7px;
    font-size: clamp(16px, 1.45vw, 28px);
    font-weight: 600;
    opacity: .9;
    letter-spacing: .5px;
  }

  #content {
    flex: 1;
    min-height: 0;
    display: flex;
  }

  #mapWrap {
    position: relative;
    flex: 1;
    min-width: 0;
    min-height: 0;
  }

  #map {
    position: absolute;
    inset: 0;
  }

  #incidents {
    width: 29%;
    min-width: 300px;
    max-width: 520px;
    background: #171717;
    color: white;
    border-left: 3px solid #444;
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
  }

  #incidentTitle {
    font-size: clamp(22px, 2vw, 36px);
    font-weight: 800;
    margin-bottom: 18px;
  }

  #incidentPlaceholder {
    font-size: clamp(17px, 1.45vw, 25px);
    line-height: 1.45;
    opacity: .78;
  }

  #incidentNote {
    margin-top: auto;
    padding-top: 18px;
    font-size: clamp(13px, 1vw, 18px);
    opacity: .55;
  }

  #footer {
    height: 9vh;
    min-height: 60px;
    background: #111;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(18px, 3vw, 55px);
    border-top: 3px solid #444;
    font-size: clamp(14px, 1.35vw, 24px);
    font-weight: 700;
  }

  .legendItem {
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }

  .dot {
    width: clamp(12px, 1vw, 20px);
    height: clamp(12px, 1vw, 20px);
    border-radius: 50%;
    display: inline-block;
  }

  .normal { background: #34a853; }
  .moderate { background: #fbbc04; }
  .heavy { background: #f4511e; }
  .severe { background: #d93025; }

  /* Our own store marker label. It is positioned geographically by Google Maps. */
  .store-label {
    background: #111;
    color: white;
    border: 2px solid white;
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 15px;
    font-weight: 800;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0,0,0,.45);
  }
</style>
</head>

<body>
<div id="app">
  <header id="header">
    <div id="title">CURRENT TRAFFIC CONDITIONS</div>
    <div id="subtitle">Johnny Vapes — Manitowoc, Wisconsin</div>
  </header>

  <main id="content">
    <section id="mapWrap">
      <div id="map"></div>
    </section>

    <aside id="incidents">
      <div id="incidentTitle">CLOSURES &amp; INCIDENTS</div>
      <div id="incidentPlaceholder">
        No incident data source connected yet.
        <br><br>
        This area is reserved for a future incident feed.
      </div>
      <div id="incidentNote">Google live traffic remains active on the map.</div>
    </aside>
  </main>

  <footer id="footer">
    <div class="legendItem"><span class="dot normal"></span>Normal</div>
    <div class="legendItem"><span class="dot moderate"></span>Moderate</div>
    <div class="legendItem"><span class="dot heavy"></span>Heavy</div>
    <div class="legendItem"><span class="dot severe"></span>Severe</div>
  </footer>
</div>

<script>
function initMap() {
  const store = { lat: 44.0764905, lng: -87.7022507 };

  const map = new google.maps.Map(document.getElementById("map"), {
    center: store,
    zoom: 13,
    mapTypeId: "roadmap",

    disableDefaultUI: true,
    clickableIcons: false,
    keyboardShortcuts: false,
    gestureHandling: "none",

    streetViewControl: false,
    fullscreenControl: false,
    mapTypeControl: false,
    zoomControl: false,
    scaleControl: false,
    rotateControl: false,
    cameraControl: false
  });

  // Google continuously refreshes the TrafficLayer while it remains active.
  const trafficLayer = new google.maps.TrafficLayer({
    autoRefresh: true
  });
  trafficLayer.setMap(map);

  // Store marker: this is our own marker, independent of Google's POI data.
  const marker = new google.maps.Marker({
    position: store,
    map: map,
    title: "Johnny Vapes Manitowoc",
    label: {
      text: "JOHNNY VAPES",
      color: "#ffffff",
      fontWeight: "800",
      fontSize: "14px"
    }
  });

  // Keep the map centered after browser/TV layout changes.
  window.addEventListener("resize", () => {
    google.maps.event.trigger(map, "resize");
    map.setCenter(store);
  });
}

window.gm_authFailure = function () {
  document.body.innerHTML =
    '<div style="font-family:Arial;color:#fff;background:#111;height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px">' +
    '<div><h1>Google Maps authentication failed</h1><p>Check the test API key and Maps JavaScript API configuration.</p></div></div>';
};
</script>

<script async
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAdbPq5kk4D1xjx4Z4jgp6feB1I4kvOPCA&loading=async&callback=initMap&v=weekly">
</script>
</body>
</html>
