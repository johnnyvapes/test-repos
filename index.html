<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Johnny Vapes — Manitowoc Traffic</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #111;
    font-family: Arial, Helvetica, sans-serif;
  }

  #app {
    width: 100vw;
    height: 100vh;
    background: #111;
  }

  /* Keep the title prominent, but give the map almost the entire screen. */
  #header {
    height: 11vh;
    min-height: 72px;
    background: #111;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    border-bottom: 3px solid #444;
    letter-spacing: 1px;
    position: relative;
    z-index: 5;
  }

  #title {
    font-size: clamp(28px, 3.1vw, 54px);
    font-weight: 800;
    line-height: 1;
  }

  #subtitle {
    margin-top: 6px;
    font-size: clamp(15px, 1.35vw, 26px);
    font-weight: 600;
    opacity: .9;
    letter-spacing: .5px;
  }

  #content {
    position: relative;
    height: 89vh;
    min-height: 0;
  }

  /* The map is now the entire content area. */
  #mapWrap {
    position: absolute;
    inset: 0;
  }

  #map {
    position: absolute;
    inset: 0;
  }

  /*
    Compact incident panel overlays the map instead of taking map width away.
    This leaves the vast majority of the screen available for Google traffic.
  */
  #incidents {
    position: absolute;
    z-index: 4;
    left: 1.2vw;
    top: 1.5vh;
    width: min(21vw, 360px);
    max-height: 38vh;
    overflow: hidden;
    background: rgba(17,17,17,.90);
    color: white;
    border: 2px solid rgba(255,255,255,.30);
    border-radius: 10px;
    padding: 14px 16px;
    box-shadow: 0 3px 14px rgba(0,0,0,.45);
  }

  #incidentTitle {
    font-size: clamp(18px, 1.55vw, 28px);
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 10px;
  }

  #incidentPlaceholder {
    font-size: clamp(13px, 1.05vw, 19px);
    line-height: 1.35;
    opacity: .82;
  }

  #incidentNote {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,.18);
    font-size: clamp(11px, .82vw, 15px);
    opacity: .55;
  }

  /*
    Traffic legend sits directly on top of the map.
    It no longer consumes a separate footer area.
  */
  #footer {
    position: absolute;
    z-index: 4;
    left: 50%;
    bottom: 12px;
    transform: translateX(-50%);
    background: rgba(17,17,17,.88);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(14px, 2.2vw, 38px);
    border: 2px solid rgba(255,255,255,.25);
    border-radius: 9px;
    padding: 8px 18px;
    font-size: clamp(13px, 1.05vw, 20px);
    font-weight: 700;
    white-space: nowrap;
    box-shadow: 0 2px 10px rgba(0,0,0,.4);
  }

  .legendItem {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .dot {
    width: clamp(11px, .9vw, 17px);
    height: clamp(11px, .9vw, 17px);
    border-radius: 50%;
    display: inline-block;
  }

  .normal { background: #34a853; }
  .moderate { background: #fbbc04; }
  .heavy { background: #f4511e; }
  .severe { background: #d93025; }

  .store-label {
    background: #111;
    color: white;
    border: 2px solid white;
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 15px;
    font-weight: 800;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0,0,0,.45);
  }

  /* On narrow screens, keep the incident panel compact. */
  @media (max-width: 900px) {
    #incidents {
      width: 250px;
      max-height: 31vh;
    }

    #footer {
      gap: 10px;
      padding: 7px 12px;
    }
  }
</style>
</head>

<body>
<div id="app">
  <header id="header">
    <div id="title">CURRENT TRAFFIC CONDITIONS</div>
    <div id="subtitle">Johnny Vapes — Manitowoc, Wisconsin</div>
  </header>

  <main id="content">
    <section id="mapWrap">
      <div id="map"></div>
    </section>

    <aside id="incidents">
      <div id="incidentTitle">CLOSURES &amp; INCIDENTS</div>
      <div id="incidentPlaceholder">
        No incident data source connected yet.
      </div>
      <div id="incidentNote">
        Reserved for a future incident feed.
      </div>
    </aside>

    <footer id="footer">
      <div class="legendItem"><span class="dot normal"></span>Normal</div>
      <div class="legendItem"><span class="dot moderate"></span>Moderate</div>
      <div class="legendItem"><span class="dot heavy"></span>Heavy</div>
      <div class="legendItem"><span class="dot severe"></span>Severe</div>
    </footer>
  </main>

  <footer id="footer">
    <div class="legendItem"><span class="dot normal"></span>Normal</div>
    <div class="legendItem"><span class="dot moderate"></span>Moderate</div>
    <div class="legendItem"><span class="dot heavy"></span>Heavy</div>
    <div class="legendItem"><span class="dot severe"></span>Severe</div>
  </footer>
</div>

<script>
function initMap() {
  const store = { lat: 44.0764905, lng: -87.7022507 };

  const map = new google.maps.Map(document.getElementById("map"), {
    center: store,
    zoom: 13,
    mapTypeId: "roadmap",

    disableDefaultUI: true,
    clickableIcons: false,
    keyboardShortcuts: false,
    gestureHandling: "none",

    streetViewControl: false,
    fullscreenControl: false,
    mapTypeControl: false,
    zoomControl: false,
    scaleControl: false,
    rotateControl: false,
    cameraControl: false
  });

  // Google continuously refreshes the TrafficLayer while it remains active.
  const trafficLayer = new google.maps.TrafficLayer({
    autoRefresh: true
  });
  trafficLayer.setMap(map);

  // Store marker: this is our own marker, independent of Google's POI data.
  const marker = new google.maps.Marker({
    position: store,
    map: map,
    title: "Johnny Vapes Manitowoc",
    label: {
      text: "JOHNNY VAPES",
      color: "#ffffff",
      fontWeight: "800",
      fontSize: "14px"
    }
  });

  // Keep the map centered after browser/TV layout changes.
  window.addEventListener("resize", () => {
    google.maps.event.trigger(map, "resize");
    map.setCenter(store);
  });
}

window.gm_authFailure = function () {
  document.body.innerHTML =
    '<div style="font-family:Arial;color:#fff;background:#111;height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px">' +
    '<div><h1>Google Maps authentication failed</h1><p>Check the test API key and Maps JavaScript API configuration.</p></div></div>';
};
</script>

<script async
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAdbPq5kk4D1xjx4Z4jgp6feB1I4kvOPCA&loading=async&callback=initMap&v=weekly">
</script>
</body>
</html>
